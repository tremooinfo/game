<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>네온 브레이커</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0414; overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  canvas { background: #12061f; max-height: 100vh; max-width: 100vw; aspect-ratio: 480 / 720; height: 100vh; box-shadow: 0 0 40px #6b1b6b; cursor: none; }
</style>
</head>
<body>
<canvas id="c" width="480" height="720"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const PY = H - 60, PH = 14;          // 패들 y, 높이
const COLS = 10, BW = 44, BH = 20, GAP = 2, BX0 = (W - (COLS * (BW + GAP) - GAP)) / 2, BY0 = 100;

// ---------- 유틸 ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);

// ---------- 사운드 ----------
let actx = null;
function sfx(type) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.connect(g); g.connect(actx.destination);
    const t = actx.currentTime;
    const presets = {
      paddle: ['square', 330, 330, 0.06, 0.08],
      brick:  ['triangle', 520 + Math.min(combo, 12) * 60, 900, 0.08, 0.08],
      steel:  ['square', 160, 140, 0.05, 0.06],
      wall:   ['sine', 240, 240, 0.04, 0.04],
      power:  ['triangle', 400, 1400, 0.12, 0.3],
      laser:  ['sawtooth', 1200, 600, 0.02, 0.05],
      lose:   ['sawtooth', 300, 50, 0.18, 0.6],
      clear:  ['triangle', 500, 1500, 0.15, 0.6],
    };
    const [wave, f1, f2, vol, dur] = presets[type];
    o.type = wave;
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.start(t); o.stop(t + dur);
  } catch (e) {}
}

// ---------- 스테이지 ('.' 빈칸, 1~3 내구도, # 파괴 불가) ----------
const LEVELS = [
  ['1111111111', '1111111111', '2222222222', '1111111111', '1111111111'],
  ['....11....', '...1221...', '..122221..', '.12233221.', '1223333221'],
  ['2222222222', '1.1.1.1.1.', '#11####11#', '1111111111', '.22.22.22.'],
  ['1212121212', '2121212121', '1#1#11#1#1', '3333333333', '1111111111', '2..2..2..2'],
  ['.33....33.', '3223..3223', '3222332223', '.32222223.', '..322223..', '...3223...', '....33....'],
];
const ROW_HUES = [190, 160, 120, 60, 30, 330, 280];

// ---------- 입력 ----------
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'Escape') location.href = 'index.html';
  if (e.code === 'KeyP' && state === 'play') paused = !paused;
  if (e.code === 'Enter' || e.code === 'Space') action();
});
addEventListener('keyup', e => keys[e.code] = false);
function canvasX(e) { const r = cv.getBoundingClientRect(); return (e.clientX - r.left) * W / r.width; }
cv.addEventListener('pointermove', e => { if (state === 'play' && !paused) paddle.x = canvasX(e); });
cv.addEventListener('pointerdown', e => { if (state === 'play') paddle.x = canvasX(e); action(); });

// ---------- 상태 ----------
let state = 'title', paused = false;
let paddle, balls, bricks, items, lasers, particles, popups;
let score, lives, round, combo, flash, timers, laserCd, best;
try { best = +localStorage.getItem('neonBreakerBest') || 0; } catch (e) { best = 0; }

function baseSpeed() { return Math.min(620, 380 + (round - 1) * 30) * (timers.slow > 0 ? 0.65 : 1); }

function newBall(stuck = true) {
  return { x: paddle.x, y: PY - 8, vx: 0, vy: 0, r: 7, stuck, off: rand(-10, 10), trail: [] };
}

function loadLevel() {
  bricks = [];
  const L = LEVELS[(round - 1) % LEVELS.length];
  const extra = Math.floor((round - 1) / LEVELS.length); // 한 바퀴 돌면 내구도 +1
  L.forEach((row, r) => [...row].forEach((ch, c) => {
    if (ch === '.') return;
    const hp = ch === '#' ? Infinity : Math.min(3, +ch + extra);
    bricks.push({ x: BX0 + c * (BW + GAP), y: BY0 + r * (BH + GAP), w: BW, h: BH, hp, maxHp: hp, row: r });
  }));
  items = []; lasers = [];
  balls = [newBall()];
  timers = { wide: 0, laser: 0, slow: 0 };
}

function reset() {
  paddle = { x: W / 2, w: 90 };
  particles = []; popups = [];
  score = 0; lives = 3; round = 1; combo = 0; flash = 0; laserCd = 0;
  timers = { wide: 0, laser: 0, slow: 0 };
  loadLevel();
}

function action() {
  if (state !== 'play') { reset(); state = 'play'; paused = false; return; }
  if (paused) return;
  for (const b of balls) if (b.stuck) launch(b);
}

function launch(b) {
  b.stuck = false;
  const a = rand(-0.35, 0.35), s = baseSpeed();
  b.vx = Math.sin(a) * s; b.vy = -Math.cos(a) * s;
}

// ---------- 이펙트 ----------
function burst(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(60, 280);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.3, 0.7), max: 0.7, color });
  }
}
function brickColor(b) {
  if (b.hp === Infinity) return '#8a8aa0';
  if (b.hp >= 3) return '#b56bff';
  if (b.hp === 2) return '#ff4fd8';
  return `hsl(${ROW_HUES[b.row % ROW_HUES.length]},100%,60%)`;
}

// ---------- 블록 피격 ----------
function damageBrick(b, fromBall) {
  if (b.hp === Infinity) { sfx('steel'); return; }
  b.hp--;
  if (b.hp > 0) { sfx('steel'); burst(b.x + b.w / 2, b.y + b.h / 2, 4, brickColor(b)); return; }
  if (fromBall) combo++;
  const pts = 10 * b.maxHp * Math.max(1, combo);
  score += pts;
  sfx('brick'); flash = 0.06;
  burst(b.x + b.w / 2, b.y + b.h / 2, 14, brickColor({ ...b, hp: 1 }));
  if (combo >= 3) popups.push({ x: b.x + b.w / 2, y: b.y, text: `${combo} COMBO +${pts}`, life: 0.8 });
  if (Math.random() < 0.16) {
    const r = Math.random();
    const kind = r < 0.26 ? 'E' : r < 0.52 ? 'M' : r < 0.74 ? 'L' : r < 0.94 ? 'S' : '+';
    items.push({ x: b.x + b.w / 2, y: b.y + b.h / 2, kind });
  }
}

function collideBricks(ball) {
  for (const b of bricks) {
    if (b.hp <= 0) continue;
    const cx = clamp(ball.x, b.x, b.x + b.w), cy = clamp(ball.y, b.y, b.y + b.h);
    if ((ball.x - cx) ** 2 + (ball.y - cy) ** 2 > ball.r * ball.r) continue;
    const ox = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
    const oy = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
    if (ox < oy) { ball.vx = ball.x < b.x + b.w / 2 ? -Math.abs(ball.vx) : Math.abs(ball.vx); ball.x += ball.vx > 0 ? ox : -ox; }
    else { ball.vy = ball.y < b.y + b.h / 2 ? -Math.abs(ball.vy) : Math.abs(ball.vy); ball.y += ball.vy > 0 ? oy : -oy; }
    damageBrick(b, true);
    return;
  }
}

// ---------- 업데이트 ----------
function update(dt) {
  for (const k in timers) timers[k] = Math.max(0, timers[k] - dt);
  const targetW = timers.wide > 0 ? 140 : 90;
  paddle.w += (targetW - paddle.w) * Math.min(1, dt * 8);
  if (keys.ArrowLeft || keys.KeyA) paddle.x -= 560 * dt;
  if (keys.ArrowRight || keys.KeyD) paddle.x += 560 * dt;
  paddle.x = clamp(paddle.x, paddle.w / 2, W - paddle.w / 2);

  // 레이저
  if (timers.laser > 0) {
    laserCd -= dt;
    if (laserCd <= 0) {
      laserCd = 0.22; sfx('laser');
      lasers.push({ x: paddle.x - paddle.w / 2 + 6, y: PY }, { x: paddle.x + paddle.w / 2 - 6, y: PY });
    }
  }
  for (const l of lasers) {
    l.y -= 700 * dt;
    for (const b of bricks) if (b.hp > 0 && l.x > b.x && l.x < b.x + b.w && l.y > b.y && l.y < b.y + b.h) { damageBrick(b, false); l.dead = true; break; }
  }
  lasers = lasers.filter(l => !l.dead && l.y > 0);

  // 공
  const sp = baseSpeed();
  for (const ball of balls) {
    if (ball.stuck) { ball.x = paddle.x + ball.off; ball.y = PY - ball.r - 1; continue; }
    // 속도 정규화 + 너무 수평이 되지 않게
    const cur = Math.hypot(ball.vx, ball.vy) || 1;
    ball.vx *= sp / cur; ball.vy *= sp / cur;
    if (Math.abs(ball.vy) < sp * 0.3) { ball.vy = Math.sign(ball.vy || -1) * sp * 0.3; ball.vx = Math.sign(ball.vx) * Math.sqrt(sp * sp - ball.vy * ball.vy); }

    const steps = Math.ceil(sp * dt / 4);
    for (let s = 0; s < steps; s++) {
      ball.x += ball.vx * dt / steps; ball.y += ball.vy * dt / steps;
      if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); sfx('wall'); }
      if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); sfx('wall'); }
      if (ball.y < 50 + ball.r) { ball.y = 50 + ball.r; ball.vy = Math.abs(ball.vy); sfx('wall'); }
      // 패들
      if (ball.vy > 0 && ball.y + ball.r >= PY && ball.y - ball.r <= PY + PH && Math.abs(ball.x - paddle.x) <= paddle.w / 2 + ball.r) {
        const rel = clamp((ball.x - paddle.x) / (paddle.w / 2), -1, 1);
        const a = rel * 1.05;
        ball.vx = Math.sin(a) * sp; ball.vy = -Math.cos(a) * sp;
        ball.y = PY - ball.r;
        combo = 0; sfx('paddle');
      }
      collideBricks(ball);
    }
    ball.trail.push({ x: ball.x, y: ball.y });
    if (ball.trail.length > 10) ball.trail.shift();
    if (ball.y > H + 20) ball.dead = true;
  }
  balls = balls.filter(b => !b.dead);
  if (balls.length === 0) {
    lives--; sfx('lose'); combo = 0;
    burst(paddle.x, PY, 30, '#ff4fd8');
    if (lives <= 0) {
      state = 'over';
      if (score > best) { best = score; try { localStorage.setItem('neonBreakerBest', best); } catch (e) {} }
      return;
    }
    timers = { wide: 0, laser: 0, slow: 0 };
    balls = [newBall()];
  }

  // 아이템
  for (const it of items) {
    it.y += 150 * dt;
    if (it.y > PY - 8 && it.y < PY + PH + 8 && Math.abs(it.x - paddle.x) < paddle.w / 2 + 12) {
      it.got = true; sfx('power');
      const names = { E: '패들 확장', M: '멀티볼', L: '레이저', S: '슬로우', '+': '목숨 +1' };
      popups.push({ x: it.x, y: PY - 20, text: names[it.kind], life: 1 });
      if (it.kind === 'E') timers.wide = 12;
      if (it.kind === 'L') timers.laser = 8;
      if (it.kind === 'S') timers.slow = 8;
      if (it.kind === '+') lives = Math.min(6, lives + 1);
      if (it.kind === 'M') {
        const add = [];
        for (const b of balls) {
          if (b.stuck) launch(b);
          for (const da of [-0.4, 0.4]) {
            const a = Math.atan2(b.vy, b.vx) + da;
            add.push({ ...newBall(false), x: b.x, y: b.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp });
          }
        }
        balls.push(...add.slice(0, 12 - balls.length));
      }
    }
  }
  items = items.filter(it => !it.got && it.y < H + 20);

  // 스테이지 클리어
  if (bricks.every(b => b.hp <= 0 || b.hp === Infinity)) {
    score += 1000 * round; sfx('clear');
    popups.push({ x: W / 2, y: H / 2, text: `ROUND ${round} CLEAR! +${1000 * round}`, life: 1.6, big: true });
    round++; loadLevel();
  }

  for (const p of particles) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; }
  particles = particles.filter(p => p.life > 0);
  for (const p of popups) { p.life -= dt; p.y -= 30 * dt; }
  popups = popups.filter(p => p.life > 0);
  flash = Math.max(0, flash - dt);
}

// ---------- 그리기 ----------
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1a0630'); g.addColorStop(1, '#07020d');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 원근 그리드
  ctx.strokeStyle = 'rgba(255,79,216,0.12)'; ctx.lineWidth = 1;
  const t = (performance.now() / 40) % 40;
  for (let y = H * 0.55 + t; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  for (let i = -10; i <= 10; i++) { ctx.beginPath(); ctx.moveTo(W / 2 + i * 20, H * 0.55); ctx.lineTo(W / 2 + i * 90, H); ctx.stroke(); }
}

function drawCenter(lines, y0 = H / 2 - 100) {
  ctx.textAlign = 'center';
  lines.forEach(([txt, size, color], i) => {
    ctx.font = `bold ${size}px "Malgun Gothic", sans-serif`;
    ctx.fillStyle = color; ctx.fillText(txt, W / 2, y0 + i * 42);
  });
}

function draw() {
  drawBackground();

  if (state === 'title') {
    ctx.shadowColor = '#ff4fd8'; ctx.shadowBlur = 20;
    drawCenter([
      ['NEON BREAKER', 46, '#ff7be5'],
      ['네온 브레이커', 22, '#f3d6ff'],
      ['', 10, '#fff'],
      ['이동: ← → / 마우스 / 터치', 16, '#c9b'],
      ['발사: Space / 클릭   일시정지: P', 16, '#c9b'],
      [Math.floor(performance.now() / 500) % 2 ? 'ENTER / 클릭으로 시작' : '', 22, '#ffe14d'],
      ['ESC: 메뉴로', 14, '#869'],
    ]);
    ctx.shadowBlur = 0;
    return;
  }

  // 벽 상단 라인
  ctx.fillStyle = '#ff4fd8'; ctx.fillRect(0, 48, W, 2);

  // 블록
  ctx.shadowBlur = 10;
  for (const b of bricks) {
    if (b.hp <= 0) continue;
    const c = brickColor(b);
    ctx.shadowColor = c; ctx.fillStyle = c;
    roundRect(b.x, b.y, b.w, b.h, 4); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(b.x + 3, b.y + 3, b.w - 6, 4);
    if (b.hp === Infinity) { ctx.strokeStyle = '#555'; ctx.lineWidth = 2; ctx.strokeRect(b.x + 4, b.y + 4, b.w - 8, b.h - 8); }
  }

  // 아이템
  const IC = { E: '#4dd2ff', M: '#ffe14d', L: '#ff4d4d', S: '#7dff8a', '+': '#ff7be5' };
  for (const it of items) {
    ctx.shadowColor = IC[it.kind]; ctx.fillStyle = IC[it.kind];
    roundRect(it.x - 16, it.y - 9, 32, 18, 9); ctx.fill();
    ctx.shadowBlur = 0; ctx.fillStyle = '#111'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(it.kind, it.x, it.y + 5); ctx.shadowBlur = 10;
  }

  // 레이저
  ctx.shadowColor = '#ff4d4d'; ctx.fillStyle = '#ff8080';
  for (const l of lasers) ctx.fillRect(l.x - 1.5, l.y - 12, 3, 12);

  // 패들
  const pc = timers.laser > 0 ? '#ff4d4d' : '#4dd2ff';
  ctx.shadowColor = pc; ctx.fillStyle = pc;
  roundRect(paddle.x - paddle.w / 2, PY, paddle.w, PH, 7); ctx.fill();
  ctx.fillStyle = '#fff'; roundRect(paddle.x - paddle.w / 2 + 8, PY + 3, paddle.w - 16, 3, 2); ctx.fill();

  // 공
  for (const ball of balls) {
    ball.trail.forEach((p, i) => {
      ctx.globalAlpha = i / ball.trail.length * 0.4;
      ctx.fillStyle = '#ff7be5';
      ctx.beginPath(); ctx.arc(p.x, p.y, ball.r * i / ball.trail.length, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.shadowColor = '#fff'; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.shadowBlur = 0;

  for (const p of particles) {
    ctx.globalAlpha = p.life / p.max; ctx.fillStyle = p.color; ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  for (const p of popups) {
    ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.font = `bold ${p.big ? 26 : 15}px "Malgun Gothic", sans-serif`; ctx.textAlign = 'center';
    ctx.fillStyle = p.big ? '#ffe14d' : '#fff'; ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;

  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash})`; ctx.fillRect(0, 0, W, H); }

  // HUD
  ctx.fillStyle = '#fff'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(`점수 ${score}`, 12, 30);
  ctx.textAlign = 'center'; ctx.fillStyle = '#ff7be5'; ctx.fillText(`ROUND ${round}`, W / 2, 30);
  ctx.textAlign = 'right'; ctx.fillStyle = '#ff6b8a'; ctx.fillText('♥'.repeat(lives), W - 12, 30);
  ctx.font = '13px sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = '#ccc';
  const act = [];
  if (timers.wide > 0) act.push(`확장 ${timers.wide.toFixed(0)}`);
  if (timers.laser > 0) act.push(`레이저 ${timers.laser.toFixed(0)}`);
  if (timers.slow > 0) act.push(`슬로우 ${timers.slow.toFixed(0)}`);
  ctx.fillText(act.join('  '), 12, H - 16);
  ctx.textAlign = 'right'; ctx.fillText(`최고 ${Math.max(best, score)}`, W - 12, H - 16);

  if (balls.some(b => b.stuck) && state === 'play') drawCenter([['Space / 클릭으로 발사', 18, '#ffe14d']], H / 2 + 120);
  if (paused) drawCenter([['일시정지', 40, '#fff'], ['P 키로 계속', 18, '#c9b']]);
  if (state === 'over') {
    ctx.fillStyle = '#000b'; ctx.fillRect(0, 0, W, H);
    drawCenter([
      ['GAME OVER', 46, '#ff4fd8'],
      [`점수 ${score}  (ROUND ${round})`, 24, '#fff'],
      [score >= best && score > 0 ? '🎉 최고 기록!' : `최고 기록 ${best}`, 20, '#ffe14d'],
      ['', 10, '#fff'],
      ['ENTER / 클릭으로 다시 시작', 20, '#f3d6ff'],
      ['ESC: 메뉴로', 14, '#a9b'],
    ]);
  }
}

// ---------- 루프 ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  if (state === 'play' && !paused) update(dt);
  draw();
  requestAnimationFrame(loop);
}
reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
