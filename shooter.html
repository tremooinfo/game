<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>스카이 스트라이커</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060f; overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  canvas { background: #0a0d24; max-height: 100vh; max-width: 100vw; aspect-ratio: 480 / 720; height: 100vh; box-shadow: 0 0 40px #1b2a6b; }
</style>
</head>
<body>
<canvas id="c" width="480" height="720"></canvas>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

// ---------- 입력 ----------
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'Enter') onEnter();
  if (e.code === 'Escape') location.href = 'index.html';
  if (e.code === 'KeyP' && state === 'play') paused = !paused;
  if (e.code === 'KeyB' || e.code === 'KeyX') useBomb();
});
addEventListener('keyup', e => keys[e.code] = false);

let touch = null;
function canvasPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
cv.addEventListener('pointerdown', e => {
  if (state !== 'play') { onEnter(); return; }
  const p = canvasPos(e);
  touch = { sx: p.x, sy: p.y, px: player.x, py: player.y, t: performance.now() };
});
cv.addEventListener('pointermove', e => {
  if (!touch) return;
  const p = canvasPos(e);
  player.x = clamp(touch.px + (p.x - touch.sx) * 1.3, 20, W - 20);
  player.y = clamp(touch.py + (p.y - touch.sy) * 1.3, 40, H - 30);
});
addEventListener('pointerup', () => {
  if (touch && performance.now() - touch.t < 180 && Math.hypot(player.x - touch.px, player.y - touch.py) < 5) useBomb();
  touch = null;
});

// ---------- 유틸 ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const hit = (a, b) => Math.hypot(a.x - b.x, a.y - b.y) < a.r + b.r;

// ---------- 사운드 (WebAudio 간단 효과음) ----------
let actx = null;
function sfx(type) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.connect(g); g.connect(actx.destination);
    const t = actx.currentTime;
    const presets = {
      shoot:   ['square', 880, 440, 0.03, 0.05],
      boom:    ['sawtooth', 160, 40, 0.15, 0.3],
      power:   ['triangle', 400, 1200, 0.12, 0.25],
      hurt:    ['sawtooth', 300, 60, 0.2, 0.4],
      bomb:    ['sawtooth', 90, 20, 0.25, 0.8],
    };
    const [wave, f1, f2, vol, dur] = presets[type];
    o.type = wave;
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.start(t); o.stop(t + dur);
  } catch (e) {}
}

// ---------- 배경 별 ----------
const stars = Array.from({ length: 120 }, () => ({ x: rand(0, W), y: rand(0, H), s: rand(0.5, 2.2) }));
function drawStars(dt) {
  for (const s of stars) {
    s.y += s.s * 60 * dt * (state === 'play' ? 1.5 : 0.6);
    if (s.y > H) { s.y = 0; s.x = rand(0, W); }
    ctx.fillStyle = `rgba(180,200,255,${0.3 + s.s / 3})`;
    ctx.fillRect(s.x, s.y, s.s, s.s * 2);
  }
}

// ---------- 게임 상태 ----------
let state = 'title'; // title | play | over
let paused = false;
let player, bullets, eBullets, enemies, particles, items, boss;
let score, lives, bombs, level, spawnT, bossNext, shake, best;
try { best = +localStorage.getItem('skyStrikerBest') || 0; } catch (e) { best = 0; }

function reset() {
  player = { x: W / 2, y: H - 90, r: 9, power: 1, cd: 0, inv: 2 };
  bullets = []; eBullets = []; enemies = []; particles = []; items = [];
  boss = null;
  score = 0; lives = 3; bombs = 2; level = 1; spawnT = 0; bossNext = 3000; shake = 0;
}

function onEnter() {
  if (state === 'title' || state === 'over') { reset(); state = 'play'; paused = false; }
}

// ---------- 플레이어 ----------
function updatePlayer(dt) {
  const sp = (keys.ShiftLeft || keys.ShiftRight ? 160 : 300) * dt;
  if (keys.ArrowLeft || keys.KeyA) player.x -= sp;
  if (keys.ArrowRight || keys.KeyD) player.x += sp;
  if (keys.ArrowUp || keys.KeyW) player.y -= sp;
  if (keys.ArrowDown || keys.KeyS) player.y += sp;
  player.x = clamp(player.x, 20, W - 20);
  player.y = clamp(player.y, 40, H - 30);
  player.inv = Math.max(0, player.inv - dt);

  // 자동 사격
  player.cd -= dt;
  if (player.cd <= 0) {
    player.cd = 0.11;
    const p = player.power;
    const shot = (dx, vx) => bullets.push({ x: player.x + dx, y: player.y - 18, vx, vy: -720, r: 4 });
    shot(0, 0);
    if (p >= 2) { shot(-10, 0); shot(10, 0); }
    if (p >= 3) { shot(-14, -140); shot(14, 140); }
    if (p >= 4) { shot(-18, -280); shot(18, 280); }
    if (p >= 5) { shot(-22, -60); shot(22, 60); }
    sfx('shoot');
  }
}

function drawPlane(x, y, blink) {
  if (blink && Math.floor(performance.now() / 80) % 2) return;
  ctx.save(); ctx.translate(x, y);
  // 엔진 불꽃
  ctx.fillStyle = `hsl(${30 + Math.random() * 20},100%,60%)`;
  ctx.beginPath(); ctx.moveTo(-5, 16); ctx.lineTo(0, 26 + Math.random() * 8); ctx.lineTo(5, 16); ctx.fill();
  // 날개
  ctx.fillStyle = '#3a7bff';
  ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(-24, 10); ctx.lineTo(-24, 15); ctx.lineTo(0, 9); ctx.lineTo(24, 15); ctx.lineTo(24, 10); ctx.closePath(); ctx.fill();
  // 꼬리날개
  ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(-10, 18); ctx.lineTo(10, 18); ctx.closePath(); ctx.fill();
  // 동체
  ctx.fillStyle = '#e8eefc';
  ctx.beginPath(); ctx.moveTo(0, -22); ctx.quadraticCurveTo(7, -6, 5, 16); ctx.lineTo(-5, 16); ctx.quadraticCurveTo(-7, -6, 0, -22); ctx.fill();
  // 조종석
  ctx.fillStyle = '#40e0ff';
  ctx.beginPath(); ctx.ellipse(0, -8, 3, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ---------- 적 ----------
const TYPES = {
  small:  { r: 14, hp: 2,  speed: 150, score: 100, color: '#ff5470', fire: 0 },
  zig:    { r: 15, hp: 4,  speed: 110, score: 200, color: '#ffb84d', fire: 2.2 },
  tank:   { r: 24, hp: 16, speed: 60,  score: 500, color: '#b56bff', fire: 1.4 },
};

function spawnEnemy() {
  const roll = Math.random();
  const kind = roll < 0.55 ? 'small' : roll < 0.85 || level < 2 ? 'zig' : 'tank';
  const t = TYPES[kind];
  enemies.push({
    kind, x: rand(30, W - 30), y: -30, r: t.r, hp: t.hp * (1 + (level - 1) * 0.25), maxHp: t.hp,
    vy: t.speed * (1 + level * 0.05), age: 0, fireT: rand(0.5, 1.5), phase: rand(0, 6.28), flash: 0,
  });
}

function spawnBoss() {
  boss = { x: W / 2, y: -80, r: 52, hp: 300 + level * 150, maxHp: 300 + level * 150, age: 0, fireT: 1, pattern: 0, flash: 0, entering: true };
}

function aimShot(src, speed, spread = 0) {
  const a = Math.atan2(player.y - src.y, player.x - src.x) + spread;
  eBullets.push({ x: src.x, y: src.y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, r: 5 });
}

function updateEnemies(dt) {
  spawnT -= dt;
  if (!boss && spawnT <= 0) { spawnEnemy(); spawnT = Math.max(0.25, 0.9 - level * 0.08) * rand(0.6, 1.3); }
  if (!boss && score >= bossNext) spawnBoss();

  for (const e of enemies) {
    const t = TYPES[e.kind];
    e.age += dt; e.flash = Math.max(0, e.flash - dt);
    e.y += e.vy * dt;
    if (e.kind === 'zig') e.x += Math.sin(e.age * 3 + e.phase) * 140 * dt;
    if (t.fire && e.y > 0 && e.y < H * 0.7) {
      e.fireT -= dt;
      if (e.fireT <= 0) {
        e.fireT = t.fire / (1 + level * 0.1);
        if (e.kind === 'tank') for (let i = -1; i <= 1; i++) aimShot(e, 200, i * 0.25);
        else aimShot(e, 220);
      }
    }
  }
  enemies = enemies.filter(e => e.y < H + 40 && e.hp > 0);

  if (boss) {
    const b = boss;
    b.age += dt; b.flash = Math.max(0, b.flash - dt);
    if (b.entering) { b.y += 80 * dt; if (b.y >= 120) b.entering = false; }
    else {
      b.x = W / 2 + Math.sin(b.age * 0.8) * 150;
      b.fireT -= dt;
      if (b.fireT <= 0) {
        b.pattern = (b.pattern + 1) % 3;
        if (b.pattern === 0) { // 원형 탄막
          for (let i = 0; i < 18; i++) { const a = i / 18 * Math.PI * 2 + b.age; eBullets.push({ x: b.x, y: b.y, vx: Math.cos(a) * 170, vy: Math.sin(a) * 170, r: 5 }); }
          b.fireT = 1.0;
        } else if (b.pattern === 1) { // 조준 부채꼴
          for (let i = -3; i <= 3; i++) aimShot(b, 240, i * 0.14);
          b.fireT = 0.8;
        } else { // 양쪽 연사
          aimShot({ x: b.x - 40, y: b.y + 20 }, 300); aimShot({ x: b.x + 40, y: b.y + 20 }, 300);
          b.fireT = 0.3;
        }
      }
    }
  }
}

function drawEnemy(e) {
  const t = TYPES[e.kind];
  ctx.save(); ctx.translate(e.x, e.y);
  ctx.fillStyle = e.flash > 0 ? '#fff' : t.color;
  if (e.kind === 'small') {
    ctx.beginPath(); ctx.moveTo(0, 14); ctx.lineTo(-14, -8); ctx.lineTo(0, -2); ctx.lineTo(14, -8); ctx.closePath(); ctx.fill();
  } else if (e.kind === 'zig') {
    ctx.beginPath(); ctx.moveTo(0, 16); ctx.lineTo(-16, 0); ctx.lineTo(-8, -12); ctx.lineTo(8, -12); ctx.lineTo(16, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#222'; ctx.fillRect(-3, -4, 6, 8);
  } else {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; ctx.lineTo(Math.cos(a) * 24, Math.sin(a) * 24); }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#2a0d4a'; ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff4fd8'; ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  if (e.kind === 'tank' && e.hp < e.maxHp * (1 + (level - 1) * 0.25)) {
    ctx.fillStyle = '#400'; ctx.fillRect(e.x - 20, e.y - 34, 40, 4);
    ctx.fillStyle = '#f44'; ctx.fillRect(e.x - 20, e.y - 34, 40 * e.hp / (e.maxHp * (1 + (level - 1) * 0.25)), 4);
  }
}

function drawBoss() {
  const b = boss;
  ctx.save(); ctx.translate(b.x, b.y);
  ctx.fillStyle = b.flash > 0 ? '#fff' : '#c0304a';
  ctx.beginPath();
  ctx.moveTo(0, 50); ctx.lineTo(-30, 30); ctx.lineTo(-80, 20); ctx.lineTo(-90, -10); ctx.lineTo(-40, -30);
  ctx.lineTo(0, -45); ctx.lineTo(40, -30); ctx.lineTo(90, -10); ctx.lineTo(80, 20); ctx.lineTo(30, 30); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#5a0f20';
  ctx.fillRect(-45, 10, 10, 22); ctx.fillRect(35, 10, 10, 22);
  const pulse = 10 + Math.sin(b.age * 6) * 3;
  ctx.fillStyle = '#ffe14d'; ctx.beginPath(); ctx.arc(0, 0, pulse, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // 체력바
  ctx.fillStyle = '#300'; ctx.fillRect(40, 50, W - 80, 8);
  ctx.fillStyle = '#ff3b5c'; ctx.fillRect(40, 50, (W - 80) * b.hp / b.maxHp, 8);
  ctx.strokeStyle = '#fff6'; ctx.strokeRect(40, 50, W - 80, 8);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('BOSS', W / 2, 46);
}

// ---------- 이펙트 / 아이템 ----------
function explode(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(40, 260);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.3, 0.8), max: 0.8, color });
  }
}

function dropItem(x, y) {
  const r = Math.random();
  if (r < 0.12) items.push({ x, y, r: 11, kind: 'P' });
  else if (r < 0.15) items.push({ x, y, r: 11, kind: 'B' });
  else if (r < 0.17) items.push({ x, y, r: 11, kind: 'L' });
}

function useBomb() {
  if (state !== 'play' || paused || bombs <= 0) return;
  bombs--; sfx('bomb'); shake = 0.5;
  eBullets = [];
  for (const e of enemies) { e.hp = 0; score += TYPES[e.kind].score; explode(e.x, e.y, 20, TYPES[e.kind].color); }
  if (boss && !boss.entering) { boss.hp -= boss.maxHp * 0.15; boss.flash = 0.2; }
  particles.push({ ring: true, x: player.x, y: player.y, life: 0.6, max: 0.6 });
}

function damagePlayer() {
  if (player.inv > 0) return;
  lives--; sfx('hurt'); shake = 0.4;
  explode(player.x, player.y, 40, '#7fb2ff');
  player.power = Math.max(1, player.power - 1);
  player.inv = 2.5;
  eBullets = eBullets.filter(b => Math.hypot(b.x - player.x, b.y - player.y) > 120);
  if (lives <= 0) {
    state = 'over';
    if (score > best) { best = score; try { localStorage.setItem('skyStrikerBest', best); } catch (e) {} }
  }
}

// ---------- 메인 업데이트 ----------
function update(dt) {
  updatePlayer(dt);
  updateEnemies(dt);

  for (const b of bullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
  for (const b of eBullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
  bullets = bullets.filter(b => b.y > -20 && b.x > -20 && b.x < W + 20 && !b.dead);
  eBullets = eBullets.filter(b => b.y > -20 && b.y < H + 20 && b.x > -20 && b.x < W + 20);

  // 플레이어 탄 vs 적
  for (const b of bullets) {
    for (const e of enemies) {
      if (e.hp > 0 && hit(b, e)) {
        b.dead = true; e.hp -= 1; e.flash = 0.06;
        if (e.hp <= 0) {
          score += TYPES[e.kind].score; sfx('boom');
          explode(e.x, e.y, e.kind === 'tank' ? 35 : 18, TYPES[e.kind].color);
          dropItem(e.x, e.y);
        }
        break;
      }
    }
    if (!b.dead && boss && !boss.entering && hit(b, boss)) {
      b.dead = true; boss.hp -= 1; boss.flash = 0.05;
      if (Math.random() < 0.3) explode(b.x, b.y, 2, '#ffd27f');
    }
  }
  if (boss && boss.hp <= 0) {
    score += 5000 * level; sfx('boom'); shake = 0.8;
    for (let i = 0; i < 6; i++) explode(boss.x + rand(-60, 60), boss.y + rand(-30, 30), 30, i % 2 ? '#ffe14d' : '#ff3b5c');
    items.push({ x: boss.x - 20, y: boss.y, r: 11, kind: 'P' }, { x: boss.x + 20, y: boss.y, r: 11, kind: 'L' });
    boss = null; eBullets = [];
    level++; bossNext = score + 3000 + level * 1500;
  }

  // 충돌: 적/탄 vs 플레이어
  for (const b of eBullets) if (hit(b, player)) { damagePlayer(); break; }
  for (const e of enemies) if (e.hp > 0 && hit(e, player)) { e.hp = 0; explode(e.x, e.y, 18, TYPES[e.kind].color); damagePlayer(); }
  if (boss && hit(boss, player)) damagePlayer();

  // 아이템
  for (const it of items) {
    it.y += 90 * dt;
    if (Math.hypot(it.x - player.x, it.y - player.y) < 90) { it.x += (player.x - it.x) * 4 * dt; it.y += (player.y - it.y) * 4 * dt; }
    if (hit(it, player)) {
      it.got = true; sfx('power'); score += 50;
      if (it.kind === 'P') player.power = Math.min(5, player.power + 1);
      if (it.kind === 'B') bombs = Math.min(5, bombs + 1);
      if (it.kind === 'L') lives = Math.min(5, lives + 1);
    }
  }
  items = items.filter(it => !it.got && it.y < H + 20);

  for (const p of particles) { p.life -= dt; if (!p.ring) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; } }
  particles = particles.filter(p => p.life > 0);
  shake = Math.max(0, shake - dt);
}

// ---------- 그리기 ----------
function drawHUD() {
  ctx.fillStyle = '#fff'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(`점수 ${score}`, 12, 26);
  ctx.textAlign = 'right';
  ctx.fillText(`최고 ${Math.max(best, score)}`, W - 12, 26);
  ctx.textAlign = 'left'; ctx.font = '14px sans-serif';
  ctx.fillStyle = '#ff6b8a'; ctx.fillText('♥'.repeat(lives), 12, H - 14);
  ctx.fillStyle = '#ffd24d'; ctx.fillText('💣'.repeat(bombs), 90, H - 14);
  ctx.textAlign = 'right'; ctx.fillStyle = '#8fd0ff';
  ctx.fillText(`STAGE ${level}  POWER ${player.power}`, W - 12, H - 14);
}

function drawCenter(lines) {
  ctx.textAlign = 'center';
  lines.forEach(([txt, size, color], i) => {
    ctx.font = `bold ${size}px "Malgun Gothic", sans-serif`;
    ctx.fillStyle = color;
    ctx.fillText(txt, W / 2, H / 2 - 80 + i * 44);
  });
}

function draw(dt) {
  ctx.save();
  if (shake > 0) ctx.translate(rand(-6, 6) * shake * 2, rand(-6, 6) * shake * 2);
  ctx.fillStyle = '#0a0d24'; ctx.fillRect(-20, -20, W + 40, H + 40);
  drawStars(dt);

  if (state === 'title') {
    drawPlane(W / 2, H / 2 + 140 + Math.sin(performance.now() / 400) * 8, false);
    drawCenter([
      ['SKY STRIKER', 48, '#5cc8ff'],
      ['스카이 스트라이커', 22, '#cfe3ff'],
      ['', 10, '#fff'],
      ['이동: 방향키 / WASD (Shift 정밀)', 16, '#aab'],
      ['사격: 자동   폭탄: B 또는 X   일시정지: P', 16, '#aab'],
      [Math.floor(performance.now() / 500) % 2 ? 'ENTER / 터치로 시작' : '', 22, '#ffe14d'],
      ['ESC: 메뉴로', 14, '#778'],
    ]);
    ctx.restore(); return;
  }

  for (const it of items) {
    const c = { P: '#4dff88', B: '#ffd24d', L: '#ff6b8a' }[it.kind];
    ctx.fillStyle = c; ctx.beginPath(); ctx.arc(it.x, it.y, it.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#111'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(it.kind, it.x, it.y + 5);
  }
  for (const e of enemies) drawEnemy(e);
  if (boss) drawBoss();

  ctx.fillStyle = '#9ff';
  for (const b of bullets) ctx.fillRect(b.x - 2, b.y - 8, 4, 14);
  for (const b of eBullets) {
    ctx.fillStyle = '#ff3366'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd0dc'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.45, 0, Math.PI * 2); ctx.fill();
  }

  if (state === 'play') drawPlane(player.x, player.y, player.inv > 0);

  for (const p of particles) {
    const a = p.life / p.max;
    if (p.ring) {
      ctx.strokeStyle = `rgba(255,230,120,${a})`; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.arc(p.x, p.y, (1 - a) * 600, 0, Math.PI * 2); ctx.stroke();
    } else {
      ctx.globalAlpha = a; ctx.fillStyle = p.color; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); ctx.globalAlpha = 1;
    }
  }
  ctx.restore();
  drawHUD();

  if (paused) drawCenter([['일시정지', 40, '#fff'], ['P 키로 계속', 18, '#aab']]);
  if (state === 'over') {
    ctx.fillStyle = '#000a'; ctx.fillRect(0, 0, W, H);
    drawCenter([
      ['GAME OVER', 48, '#ff4d6d'],
      [`점수 ${score}`, 26, '#fff'],
      [score >= best && score > 0 ? '🎉 최고 기록!' : `최고 기록 ${best}`, 20, '#ffe14d'],
      ['', 10, '#fff'],
      ['ENTER / 터치로 다시 시작', 20, '#cfe3ff'],
      ['ESC: 메뉴로', 14, '#99a'],
    ]);
  }
}

// ---------- 루프 ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  if (state === 'play' && !paused) update(dt);
  else if (state === 'over') { for (const p of particles) { p.life -= dt; p.x += (p.vx||0) * dt; p.y += (p.vy||0) * dt; } particles = particles.filter(p => p.life > 0); }
  draw(dt);
  requestAnimationFrame(loop);
}
reset();
requestAnimationFrame(loop);
</script>
</body>
